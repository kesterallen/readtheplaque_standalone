{% extends "base.html" %}
{% block title %}Admin Login — Read The Plaque{% endblock %}
{% block content %}
<div class="login-page">
  <h1 class="login-title">Admin Login</h1>
  <p class="login-sub">Access the approval queue.</p>
  <form method="POST" action="{{ url_for('admin.login') }}">
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >
    </div>
    <button type="submit" class="btn-save btn-save--full">Sign In</button>
  </form>
</div>
{% endblock %}
