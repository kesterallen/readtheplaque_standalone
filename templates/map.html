{% extends "base.html" %}
{% block body_class %}<body class="page-map">{% endblock %}
{% block title %}Big Map — Read The Plaque{% endblock %}

{% block content %}
<div class="map-wrapper">
  <div id="map"></div>

  <div class="map-search-bar">
    <input type="text" id="mapSearch" placeholder="Search plaques…" autocomplete="off">
    <button id="mapSearchBtn">🔍</button>
  </div>
  <div class="map-search-results" id="mapSearchResults"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var map = makeMap('map', {
  center: [{{ init_lng }}, {{ init_lat }}],
  zoom: {{ init_zoom }}
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

map.on('load', function () {

  // ── Load all plaque locations ───────────────────────────────────────────────
  fetch('/api/plaques/geo')
    .then(function (r) { return r.json(); })
    .then(function (gj) {

      map.addSource('plaques', { type: 'geojson', data: gj, generateId: true });

      // ── Density glow: low-opacity large circles that stack visually ──────────
      map.addLayer({
        id: 'plaque-glow',
        type: 'circle',
        source: 'plaques',
        paint: {
          'circle-radius': [
            'interpolate', ['linear'], ['zoom'],
            2, 8,
            8, 14,
            14, 20
          ],
          'circle-color': '#d9534f',
          'circle-opacity': 0.12,
          'circle-stroke-width': 0,
          'circle-blur': 0.5,
        }
      });

      // ── Solid dot on top — visible at higher zoom ─────────────────────────────
      map.addLayer({
        id: 'plaque-dot',
        type: 'circle',
        source: 'plaques',
        paint: {
          'circle-radius': [
            'interpolate', ['linear'], ['zoom'],
            4, 3,
            10, 5,
            16, 8
          ],
          'circle-color': '#d9534f',
          'circle-opacity': [
            'interpolate', ['linear'], ['zoom'],
            3, 0.0,
            6, 0.7,
            10, 0.9
          ],
          'circle-stroke-width': 1,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': [
            'interpolate', ['linear'], ['zoom'],
            6, 0.0,
            8, 0.6
          ],
        }
      });

      // ── Hover highlight ───────────────────────────────────────────────────────
      map.addLayer({
        id: 'plaque-hover',
        type: 'circle',
        source: 'plaques',
        paint: {
          'circle-radius': 10,
          'circle-color': '#c9302c',
          'circle-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.9, 0],
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 1, 0],
        }
      });

      // ── Popup on click ────────────────────────────────────────────────────────
      var popup = new maplibregl.Popup({ closeButton: true, maxWidth: '260px' });
      var hoveredId = null;

      map.on('mouseenter', 'plaque-dot', function (e) {
        map.getCanvas().style.cursor = 'pointer';
        if (hoveredId !== null) {
          map.setFeatureState({ source: 'plaques', id: hoveredId }, { hover: false });
        }
        hoveredId = e.features[0].id;
        map.setFeatureState({ source: 'plaques', id: hoveredId }, { hover: true });
      });

      map.on('mouseleave', 'plaque-dot', function () {
        map.getCanvas().style.cursor = '';
        if (hoveredId !== null) {
          map.setFeatureState({ source: 'plaques', id: hoveredId }, { hover: false });
        }
        hoveredId = null;
      });

      map.on('click', 'plaque-dot', function (e) {
        var props = e.features[0].properties;
        var coords = e.features[0].geometry.coordinates.slice();

        // Show popup with loading state, then fetch image
        popup
          .setLngLat(coords)
          .setHTML(
            '<div class="popup-body">' +
            '<img class="map-popup-img" alt="">' +
            '<p class="popup-title">' + esc(props.title) + '</p>' +
            '<a class="popup-link" href="/plaque/' + esc(props.slug) + '">Read full plaque →</a>' +
            '</div>'
          )
          .addTo(map);

        fetch('/api/plaques/' + props.id)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var el = popup.getElement();
            if (el) el.querySelector('.map-popup-img').src = data.thumb_url || data.image_url;
          });
      });

      // Also clickable via glow layer at low zoom
      map.on('click', 'plaque-glow', function (e) {
        if (map.getZoom() > 8) return; // dot layer handles it at high zoom
        var props = e.features[0].properties;
        map.flyTo({ center: e.features[0].geometry.coordinates, zoom: Math.max(map.getZoom() + 2, 8) });
      });

    });

  // ── Search ──────────────────────────────────────────────────────────────────
  var searchInput   = document.getElementById('mapSearch');
  var searchResults = document.getElementById('mapSearchResults');
  var debounce;

  searchInput.addEventListener('input', function () {
    var q = searchInput.value.trim();
    clearTimeout(debounce);
    if (!q) { searchResults.style.display = 'none'; return; }
    debounce = setTimeout(function () { runSearch(q); }, 300);
  });

  document.getElementById('mapSearchBtn').addEventListener('click', function () {
    var q = searchInput.value.trim();
    if (q) runSearch(q);
  });

  function runSearch(q) {
    fetch('/api/search?q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.length) {
          searchResults.innerHTML = '<div class="gsr-empty">No results for "' + esc(q) + '"</div>';
        } else {
          searchResults.innerHTML = data.slice(0, 10).map(function (p) {
            return (
              '<div class="gsr-item" data-lat="' + p.latitude + '" data-lng="' + p.longitude + '">' +
              '<img src="' + esc(p.thumb_url || p.image_url) + '" loading="lazy" alt="">' +
              '<div class="gsr-info"><strong>' + esc(p.title) + '</strong></div></div>'
            );
          }).join('');
          searchResults.querySelectorAll('.gsr-item').forEach(function (el) {
            el.addEventListener('click', function () {
              map.flyTo({ center: [+el.dataset.lng, +el.dataset.lat], zoom: 14 });
              searchResults.style.display = 'none';
              searchInput.value = '';
            });
          });
        }
        searchResults.style.display = 'block';
      });
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.map-search-bar') && !e.target.closest('.map-search-results')) {
      searchResults.style.display = 'none';
    }
  });

}); // map.on('load')
</script>
{% endblock %}
